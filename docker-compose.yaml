# Coolify Docker Compose — Next.js landing + Prisma Express backend
#
# Coolify UI checklist:
# 1. Domain / FQDN goes on service `web` only (NOT backend)
# 2. Ports Exposes for `web` = 3000
# 3. Do NOT set a shared PORT env var in Coolify (it overrides both services)
# 4. backend stays internal; Next proxies via BACKEND_URL=http://backend:3001

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Hardcoded — do not use ${PORT}; Coolify shared PORT=3001 breaks the proxy
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://thedinkhousepb.com}
      SITE_URL: ${SITE_URL:-https://thedinkhousepb.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-5}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-50}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL}
      SITE_URL: ${SITE_URL:-https://thedinkhousepb.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://thedinkhousepb.com,https://www.thedinkhousepb.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-contact@thedinkhouse.com}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER}
    restart: unless-stopped
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  coolify:
    external: true
